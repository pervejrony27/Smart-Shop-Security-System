<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Security System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
        .container { max-width: 1000px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #0056b3; }
        
        /* Status Box */
        .status-box { padding: 15px; border-radius: 5px; margin-bottom: 20px; font-size: 1.2em; font-weight: bold; text-align: center; }
        .armed { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .disarmed { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        /* Buttons */
        .buttons { text-align: center; margin-bottom: 30px; }
        .buttons button { padding: 12px 25px; margin: 0 10px; border: none; border-radius: 5px; font-size: 1em; cursor: pointer; transition: transform 0.2s, background-color 0.3s; }
        .buttons button:active { transform: scale(0.98); }
        .buttons button#armBtn { background-color: #28a745; color: white; }
        .buttons button#armBtn:hover { background-color: #218838; }
        .buttons button#disarmBtn { background-color: #dc3545; color: white; }
        .buttons button#disarmBtn:hover { background-color: #c82333; }

        /* Live Feed Section */
        .live-feed-container { text-align: center; margin-bottom: 40px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        .live-feed-img {
            width: 100%;
            max-width: 640px;
            height: auto;
            border: 5px solid #333;
            border-radius: 5px;
            background-color: #000;
        }

        /* Gallery Section */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .gallery-item {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 5px;
            background: #fff;
            text-align: center;
        }
        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 3px;
            cursor: pointer;
        }
        .gallery-item p {
            font-size: 0.8em;
            color: #666;
            margin: 5px 0 0 0;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>

<div class="container">
    <h1>Shop Security System Control Panel</h1>

    <!-- 1. System Status -->
    <div id="systemStatus" class="status-box disarmed">
        System Status: Loading...
    </div>

    <!-- 2. Control Buttons -->
    <div class="buttons">
        <button id="armBtn">ARM System</button>
        <button id="disarmBtn">DISARM System</button>
    </div>

    <!-- 3. LIVE CAMERA FEED (Always Visible) -->
    <div class="live-feed-container">
        <h2>Live Camera Feed</h2>
        <!-- src points to the backend video streaming route -->
        <img src="/video_feed" class="live-feed-img" alt="Live Camera Feed">
        <p>Live stream is active 24/7</p>
    </div>

    <!-- 4. Incident History Gallery -->
    <h2>Incident History</h2>
    <p style="text-align:center; color:#777;">Displaying all images saved to storage.</p>
    <div id="imageGallery" class="gallery-container">
    </div>
</div>

<script>
    function updateStatus() {
        $.getJSON("/status", function(data) {
            const statusBox = $("#systemStatus");
            const gallery = $("#imageGallery");

            // --- Update ARM/DISARM Status ---
            if (data.is_armed) {
                statusBox.removeClass("disarmed").addClass("armed").text("System Status: ARMED (Motion Detection Active)");
            } else {
                statusBox.removeClass("armed").addClass("disarmed").text("System Status: DISARMED (Live View Only)");
            }

            
            
            if (data.all_incidents && data.all_incidents.length > 0) {
                gallery.empty(); // Clear current list
                
                // Loop through every image sent by backend
                data.all_incidents.forEach(function(incident) {
                    // Create HTML for each image
                    const html = `
                        <div class="gallery-item">
                            <a href="${incident.url}" target="_blank">
                                <img src="${incident.url}" alt="Incident">
                            </a>
                            <p>${incident.timestamp}</p>
                        </div>
                    `;
                    gallery.append(html);
                });
            } else {
                if(gallery.is(':empty')) {
                    gallery.html('<p style="text-align:center; width:100%;">No incidents recorded yet.</p>');
                }
            }
        });
    }

    // Button Listeners
    $("#armBtn").click(function() {
        $.post("/arm", function(data) { alert(data.message); updateStatus(); });
    });

    $("#disarmBtn").click(function() {
        $.post("/disarm", function(data) { alert(data.message); updateStatus(); });
    });

    // Initial Load & Polling
    $(document).ready(function() {
        updateStatus();
        setInterval(updateStatus, 5000); // Check for new images every 5 seconds
    });
</script>

</body>
</html>
